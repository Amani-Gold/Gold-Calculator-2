<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>حاسبة المصنعية من السعر النهائي — Amani Alderazi</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:0; background:#f6f7fb; color:#111}
    .wrap{max-width:680px; margin:24px auto; padding:16px}
    .card{background:#fff; border:1px solid #e8e8ef; border-radius:14px; padding:18px; box-shadow:0 6px 18px rgba(0,0,0,.04)}
    h1{margin:0 0 8px; font-size:20px}
    .sub{margin:0 0 18px; color:#666; font-size:13px}
    label{display:block; font-size:13px; color:#333; margin:12px 0 6px}
    input{
      width:100%; padding:12px 12px; border:1px solid #ddd; border-radius:10px;
      font-size:16px; outline:none; box-sizing:border-box
    }
    .row{display:grid; gap:12px}
    @media(min-width:640px){ .row{grid-template-columns:1fr 1fr 1fr} }
    .result{margin-top:16px; padding:14px; border-radius:12px; background:#f4f6ff; border:1px solid #dfe4ff}
    .result .big{font-weight:800; font-size:20px}
    .muted{color:#666; font-size:12px; margin-top:10px}
    .footer{margin-top:14px; font-size:12px; color:#666}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>حاسبة استخراج المصنعية</h1>
      <p class="sub">
        تدخل السعر النهائي ونحسب لك المصنعية لكل غرام<br>
        المعادلة: المصنعية = (السعر النهائي ÷ 1.1 ÷ الغرامات) − سعر الذهب
      </p>

      <div class="row">
        <div>
          <label>السعر النهائي (مع الضريبة)</label>
          <input id="finalPrice" type="number" step="0.01" placeholder="مثال: 350" />
        </div>

        <div>
          <label>الغرامات</label>
          <input id="grams" type="number" step="0.01" placeholder="مثال: 10" />
        </div>

        <div>
          <label>سعر الذهب اليوم للغرام</label>
          <input id="goldPrice" type="number" step="0.01" placeholder="مثال: 25" />
        </div>
      </div>

      <div class="result">
        <div class="big">
          المصنعية لكل غرام = <span id="manufacture">—</span>
        </div>
      </div>

      <div class="footer">
        إعداد: <strong>Amani Alderazi</strong>
      </div>
      <div class="muted">النتيجة تقديرية وقد تختلف حسب المحل.</div>
    </div>
  </div>

<script>
  const finalPrice = document.getElementById("finalPrice");
  const grams = document.getElementById("grams");
  const goldPrice = document.getElementById("goldPrice");
  const manufactureEl = document.getElementById("manufacture");

  function format(n){
    return n.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:3});
  }

  function calc(){
    const f = Number(finalPrice.value) || 0;
    const g = Number(grams.value) || 0;
    const p = Number(goldPrice.value) || 0;

    if(f===0 || g===0 || p===0){
      manufactureEl.textContent = "—";
      return;
    }

    const noVat = f / 1.1;
    const manufacture = (noVat / g) - p;

    manufactureEl.textContent = format(manufacture);
  }

  [finalPrice, grams, goldPrice].forEach(i => i.addEventListener("input", calc));
</script>
</body>
</html>
